name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit both WeChat resource modes
        run: |
          mkdir -p .build/ci
          npm run --silent build:report -- ocean-shelter > .build/ci/wechat-subpackage.json
          npm run --silent build:report -- ocean-shelter --runtime-url https://example.invalid/ocean-shelter/v1/ > .build/ci/wechat-remote.json
      - name: Build isolated ocean-shelter artifacts
        run: |
          npm run build:web -- ocean-shelter
          npm run build:target -- ocean-shelter --isolated
      - name: Install Chromium for browser checks
        run: npm exec -- playwright-core install --with-deps chromium
      - name: Check WebGL and HUD in the browser
        run: |
          npm run test:browser -- nohara-house --hud --device compact --device phone --device desktop --browser chromium
          npm run test:browser -- ocean-shelter --device phone --browser chromium
          npm run test:browser -- webgl2 --device desktop --browser chromium
      - name: Retain static Web build
        uses: actions/upload-artifact@v7
        with:
          name: ocean-shelter-web
          path: .build/releases/ocean-shelter/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain audit reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-checks
          path: |
            .build/ci/
            .build/browser-check/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
